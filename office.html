<title>Γραφείο · Εξετάσεις, 801, Τιμολόγια</title>
<style>
:root{--navy:#14202e;--navy2:#2b3d52;--amber:#d98a00;--ink:#14213d;--mute:#5d6b82;--line:#d8dee9;--bg:#eef1f6;--card:#fff;--ok:#1d8a4e;--bad:#c62f2f;--na:#7a8597}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--amber)}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{display:block;font-weight:400;font-size:11px;opacity:.75;letter-spacing:1.5px;text-transform:uppercase}
header a#to525{color:#14202e;background:var(--amber);text-decoration:none;font-weight:700;font-size:14px;border-radius:9px;padding:7px 10px;white-space:nowrap}
header button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:9px;padding:7px 11px;font-size:15px}
main{max-width:860px;margin:0 auto;padding:12px 12px calc(env(safe-area-inset-bottom) + 90px)}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 2px rgba(14,42,92,.08);margin:0 0 12px;overflow:hidden}
details.card>summary{list-style:none;padding:14px 16px;font-weight:650;display:flex;align-items:center;gap:8px;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"›";margin-left:auto;font-size:22px;color:var(--mute);transition:transform .2s}
details.card[open]>summary::after{transform:rotate(90deg)}
.tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:#e7ecf5;color:var(--navy2);letter-spacing:.4px}
.tag.ok{background:#dcf2e5;color:var(--ok)}.tag.bad{background:#fbe2e2;color:var(--bad)}
.body{padding:0 16px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:4px;font-weight:600;letter-spacing:.2px}
input,select,textarea{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe;color:var(--ink);width:100%;min-width:0}
input:focus,textarea:focus{outline:2px solid var(--navy2);border-color:transparent}
textarea{min-height:60px;resize:vertical}
.seg{display:inline-flex;background:#e7ecf5;border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 13px;border-radius:8px;font:inherit;font-size:14px;font-weight:600;color:var(--navy2)}
.seg button.on{background:var(--navy);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.btn{border:0;background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;font:inherit;font-weight:650;font-size:15px}
.btn.alt{background:#e7ecf5;color:var(--navy)}.btn.amber{background:var(--amber);color:#1a1a1a}.btn.danger{background:#fbe2e2;color:var(--bad)}
.btn:disabled{opacity:.5}
.list .item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.list .item b{display:block}.list .item span{color:var(--mute);font-size:13px}
.list .item .go{margin-left:auto}
.flight{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#fbfcfe}
.flight .h{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px;display:flex;justify-content:space-between}
.sec{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.sec .sh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f4f6fa;font-weight:650;font-size:14px}
.sec .sh .t{flex:1}
.it{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid #eef1f6}
.it .k{font-weight:700;color:var(--navy2);font-size:13px}
.it .l{font-size:13.5px}
.it .cm{grid-column:2/4}
.mk{display:inline-flex;gap:3px}
.mk button{width:38px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:700;font-size:13px;color:var(--mute)}
.mk button.P.on{background:var(--ok);border-color:var(--ok);color:#fff}
.mk button.F.on{background:var(--bad);border-color:var(--bad);color:#fff}
.mk button.N.on{background:var(--na);border-color:var(--na);color:#fff}
.mk .sep{width:6px}
.cmb{border:0;background:none;font-size:15px;padding:2px 4px;opacity:.6}
.warn{margin:0;padding:0;list-style:none}
.warn li{padding:9px 12px;border-radius:9px;background:#fff4d6;margin:6px 0;font-size:14px}
.warn li.i{background:#e7ecf5}
.warn li.good{background:#dcf2e5}
.out a{display:block;padding:10px 0;color:var(--navy2);font-weight:650}
.hint{font-size:12.5px;color:var(--mute);margin:6px 0}
canvas.sig{width:100%;height:160px;border:1px dashed var(--navy2);border-radius:10px;background:#fff;touch-action:none}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:6}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;padding:6px 0}
.chk input{width:22px;height:22px}
h3{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
.forms{font-size:13px;color:var(--navy2);font-weight:600}

.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top) + 56px);z-index:4}
.tabs button{border:0;background:#e7ecf5;color:var(--navy2);padding:9px 13px;border-radius:9px;font:inherit;font-size:14px;font-weight:650;white-space:nowrap}
.tabs button.on{background:var(--navy);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;color:var(--mute);font-size:11.5px;letter-spacing:.3px;padding:6px;border-bottom:2px solid var(--line);white-space:nowrap}
table.t td{padding:7px 6px;border-bottom:1px solid #eef1f6;white-space:nowrap}
table.t tr[data-edit],table.t tr[data-month]{cursor:pointer}
table.t tr.sel td{background:#fff4d6}
table.t tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.tag.warnt{background:#fff1cc;color:#8a5a00}
header a.nav{color:#14202e;background:var(--amber);text-decoration:none;font-weight:700;font-size:13px;border-radius:9px;padding:7px 9px;white-space:nowrap}
select{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe;color:var(--ink);width:100%}
header{padding-left:calc(env(safe-area-inset-left) + 78px)}
</style>

</head>

/* Γραφείο: ημερολόγιο εξετάσεων, PEL-FCL 801, έσοδα, τιμολόγια, λήξεις */
const LOGKEY = 'pel_log_v1', OKEY = 'pel_office_v1', K525 = 'pel525-ex-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const uid = () => Math.random().toString(36).slice(2, 10);
const dmy = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return d + '/' + m + '/' + y; };
const MONTHS = ['Ιανουάριος', 'Φεβρουάριος', 'Μάρτιος', 'Απρίλιος', 'Μάιος', 'Ιούνιος', 'Ιούλιος', 'Αύγουστος', 'Σεπτέμβριος', 'Οκτώβριος', 'Νοέμβριος', 'Δεκέμβριος'];
const monthLabel = ym => { const [y, m] = ym.split('-'); return MONTHS[+m - 1] + ' ' + y; };
const eur = n => '€ ' + (Number(n) || 0).toLocaleString('el-GR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const CATS = { exam: 'Εξέταση', dek: 'Δεκέλεια', stud: 'Μαθητής', other: 'Άλλο' };
const RES = { P: 'Pass', PP: 'Partial', F: 'Fail' };

function lsGet(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
let LOG = lsGet(LOGKEY, []);
let O = Object.assign({ company: '', companyNo: '', bank: '', exName801: '', nextNo: 1, year2: String(new Date().getFullYear()).slice(2), clients: [], invoices: [], mydocs: [] }, lsGet(OKEY, {}));
const saveLog = () => localStorage.setItem(LOGKEY, JSON.stringify(LOG));
const saveO = () => localStorage.setItem(OKEY, JSON.stringify(O));
const ex525 = () => (lsGet(K525, {}).ex) || {};

let backTab = null, tab = 'log', curMonth = todayISO().slice(0, 7), edit = null, invEdit = null, curYear = todayISO().slice(0, 4);
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2200); }
const client = id => O.clients.find(c => c.id === id);
const cname = id => (client(id) || {}).name || '';
const inMonth = (e, ym) => (e.date || '').startsWith(ym);
const sortByDate = (a, b) => (a.date || '').localeCompare(b.date || '');

/* ---------- render ---------- */
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const v = { log: vLog, r801: v801, inc: vIncome, inv: vInvoices, exp: vExpiry, set: vSettings }[tab]();
  $('#app').innerHTML = v;
}
function monthPicker() {
  return `<div class="row"><button class="btn alt" data-mstep="-1">‹</button><b style="min-width:150px;text-align:center">${monthLabel(curMonth)}</b><button class="btn alt" data-mstep="1">›</button></div>`;
}
function fld(k, label, type, val, extra) { return `<label class="f">${label}<input data-e="${k}" type="${type || 'text'}" value="${esc(val)}" ${extra || ''}></label>`; }
function clientOptions(sel) { return `<option value="">— χωρίς —</option>` + O.clients.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join(''); }

function vLog() {
  const list = LOG.filter(e => inMonth(e, curMonth)).sort(sortByDate);
  let h = monthPicker();
  if (edit) h += editorHTML();
  h += `<div class="card list">${list.map(e => `<div class="item" data-edit="${e.id}"><div style="flex:1;min-width:0"><b>${dmy(e.date)} · ${esc(e.name || '—')}</b><span>${esc([CATS[e.cat] !== 'Εξέταση' ? CATS[e.cat] : '', e.test, e.type].filter(Boolean).join(' · '))}</span><span>${e.client ? esc(cname(e.client)) : '<i style="color:#c62f2f">χωρίς πελάτη</i>'}${e.invoice ? ' · τιμ. ' + esc(e.invoice) : ''}</span></div><div style="text-align:right">${e.result ? `<span class="tag ${e.result === 'P' ? 'ok' : 'bad'}">${e.result}</span><br>` : ''}<b>${e.price != null ? eur(e.price) : ''}</b></div></div>`).join('') || '<div class="item"><span>Καμία εγγραφή αυτόν τον μήνα.</span></div>'}</div>`;
  const tot = list.reduce((s, e) => s + (e.price || 0), 0);
  h += `<p class="hint">${list.length} εγγραφές · σύνολο ${eur(tot)}. Οι εξετάσεις από 525 και CPL/IR/PBN μπαίνουν αυτόματα όταν βγάζεις PDF.</p>`;
  h += `<button class="btn amber fab" id="addE">+ Εγγραφή</button>`;
  return h;
}
function editorHTML() {
  const e = edit;
  const exps = (e.exp || []).map((x, i) => `<div class="grid" style="margin-top:6px">${fld('exp.' + i + '.what', 'Τι λήγει', 'text', x.what)}${fld('exp.' + i + '.date', 'Ημερομηνία λήξης', 'date', x.date)}<button class="btn danger" data-delexp="${i}" style="align-self:end">✕</button></div>`).join('');
  return `<div class="card"><div class="body" style="padding-top:14px">
  <div class="grid"><label class="f">Κατηγορία<select data-e="cat">${Object.entries(CATS).map(([k, v]) => `<option value="${k}" ${e.cat === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>${fld('date', 'Ημερομηνία', 'date', e.date)}${fld('name', 'Όνομα', 'text', e.name, 'autocapitalize="characters"')}${fld('lic', 'Αρ. άδειας', 'text', e.lic, 'autocapitalize="characters"')}</div>
  ${e.cat === 'exam' ? `<div class="grid" style="margin-top:10px">${fld('test', 'Skill test / Prof. check', 'text', e.test, 'autocapitalize="characters" list="dl_test"')}${fld('type', 'A/C type / class', 'text', e.type, 'autocapitalize="characters"')}${fld('reg', 'Registration', 'text', e.reg, 'autocapitalize="characters"')}${fld('dep', 'Departure / Arrival', 'text', e.dep, 'autocapitalize="characters"')}${fld('time', 'Χρόνος (h:mm)', 'text', e.time)}<label class="f">Αποτέλεσμα<select data-e="result"><option value=""></option>${Object.entries(RES).map(([k, v]) => `<option value="${k}" ${e.result === k ? 'selected' : ''}>${k} · ${v}</option>`).join('')}</select></label></div>
  <label class="chk"><input type="checkbox" data-e="in801" ${e.in801 !== false ? 'checked' : ''}> Μπαίνει στο PEL-FCL 801</label>` : ''}
  <div class="grid" style="margin-top:10px"><label class="f">Πελάτης / χρέωση<select data-e="client">${clientOptions(e.client)}</select></label>${fld('price', 'Ποσό €', 'text', e.price == null ? '' : e.price, 'inputmode="decimal"')}${fld('qty', 'Ώρες / τεμ. (προαιρ.)', 'text', e.qty || '', 'inputmode="decimal"')}</div>
  <div class="grid" style="margin-top:10px">${fld('email', 'Email υποψηφίου', 'email', e.email)}${fld('phone', 'Τηλέφωνο', 'tel', e.phone)}</div>

  <datalist id="dl_test">${[...new Set(LOG.map(x => x.test).filter(Boolean))].map(t => `<option value="${esc(t)}">`).join('')}</datalist>
  </div></div>`;
}
function suggestPrice(e) {
  if (!e.client) return null;
  const same = LOG.filter(x => x.id !== e.id && x.client === e.client && x.price != null).sort(sortByDate).reverse();
  const t = (e.test || '').toUpperCase().trim();
  const m = same.find(x => (x.test || '').toUpperCase().trim() === t && t) || same.find(x => x.cat === e.cat);
  return m ? m.price : null;
}

function rows801(ym) { return LOG.filter(e => inMonth(e, ym) && e.cat === 'exam' && e.in801 !== false).sort(sortByDate); }
function v801() {

function deliver(files) {

async function toPdf(pages) {

}
function loadImg(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; }); }

async function pdfInvoice(inv) {

  const top = y; P.t('Description', X + 4, y + 12, { s: 8 }); P.t('Time', (cx[1] + cx[2]) / 2, y + 12, { s: 8, a: 'c' }); P.t('Service Fee', (cx[2] + cx[3]) / 2, y + 12, { s: 8, a: 'c' }); P.t('TOTAL', (cx[3] + cx[4]) / 2, y + 12, { s: 8, a: 'c' });
  y += head; P.l(X, y, R, y);

    if (!l.head || f != null) P.t(l.desc || f != null ? eur(lineTotal(l)) : '', cx[4] - 4, y + 14, { s: 8.5, a: 'r' });
    y += rh; P.l(X, y, R, y, { sc: '#999', lw: 0.4 });
  });
  P.r(X, y, R - X, rh, { f: '#efefef', lw: 0 }); P.t('TOTAL', cx[3] - 4, y + 14, { s: 8.5, a: 'r' }); P.t(eur(invTotal(inv)), cx[4] - 4, y + 14, { s: 8.5, b: true, a: 'r' }); y += rh;
  P.l(X, y, R, y); if (inv.note) P.t(inv.note, X + 4, y + 14, { s: 9 }); y += 22;

/* ---------- minimal XLSX writer ---------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
